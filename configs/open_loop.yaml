noise_config:
  level: 1.0
  scales:
    robot1_xy: 0.01
    robot1_yaw: 0.035
    robot2_xy: 0.01
    robot2_yaw: 0.035

    t_xy: 0.015
    t_yaw: 0.052

    t_site_xy_error: 0.0   # set to 0 if derived from noisy t pose
    t_vel_estimate: 0.05

reward_config:
  only_positive_rewards: false
  endpoint_sigma: 0.1            # exponential falloff distance for site error (m)
  push_site_sigma: 0.15          # exponential falloff distance for push site approach (m)
  scales:
    endpoint_error: 5.0          # exp(-mean_site_err / sigma): 0→1, maximized at goal
    progress: 20.0               # prev_site_error - curr_site_error (m): positive = improving
    useful_push: 2.0             # contact-weighted translation + yaw alignment
    r1_push_site: 0.5            # exp(-dist(r1, r1_push_site)): 0→1
    r2_push_site: 0.5            # exp(-dist(r2, r2_push_site)): 0→1
    action_rate: -0.01           # sum(sq(action - last_act))
    action_penalty: -0.001       # sum(sq(action))
    success: 100.0               # one-shot bonus when done by success

termination:
  success_site_error_m: 0.01         # all 3 T-site xy errors must be below this (m)
  success_consecutive_steps: 5       # how many consecutive policy steps to hold success

  min_base_height_m: 0.02            # robot base z below this → fallen
  min_upvector_z: 0.5                # robot upvector z below this → fallen (≈60 ° tilt)

  robot_robot_force_n: 20.0          # inter-robot normal force limit (N); above → terminate
  robot_robot_contact_steps: 10      # sustained contact steps (1 s at 10 Hz) → terminate

  robot_on_t_height_m: 0.06          # robot base z above this → climbing on T

  arena_half_width_m: 0.8            # |xy| beyond this for any robot or T → out of bounds

  t_tilt_cos_min: 0.5                # T up-vector z below this (≈60 °) → invalid T pose

latency:
  action_latency:
    enabled: false
    action_history_size: 16
    action_delay_mean: 3.0
    action_delay_std: 3.0
  observation_latency:
    enabled: false
    obs_history_size: 16
    obs_delay_mean: 1.0
    obs_delay_std: 0.5

training:
  num_timesteps: 200000000
  num_evals: 5
  reward_scaling: 1.0
  normalize_observations: true
  action_repeat: 1
  unroll_length: 20
  num_minibatches: 32
  num_updates_per_batch: 4
  discounting: 0.97
  learning_rate: 0.0003
  entropy_cost: 0.01
  num_envs: 8192
  batch_size: 256
  max_grad_norm: 1.0
  clipping_epsilon: 0.2
  num_eval_envs: 128

network:
  actor_hidden_dims: [256, 128]
  critic_hidden_dims: [512, 256, 128]
  policy_obs_key: state
  value_obs_key: privileged_state
